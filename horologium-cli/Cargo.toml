[package]
name = "horologium-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "horologium"
path = "src/main.rs"

[dependencies]
horologium-lib = { path = "../horologium-lib" }
anyhow = "1.0.103"
dirs = "6.0.0"
strsim = "0.11.1"
tempfile = "3.27.0"
strum = "0.28.0"
owo-colors = "4.3.0"

[dependencies.clap]
version = "4.6.6"
features = [
  "derive"
]
